[package]
name = "portfolio-tracker"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
dotenvy = "0.15"
sqlx = { version = "0.7", features = ["sqlite", "runtime-tokio", "migrate"] }
thiserror = "1"
tera = "1"
serde = { version = "1", features = ["derive"] }
yahoo_finance_api = "2"
async-trait = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }